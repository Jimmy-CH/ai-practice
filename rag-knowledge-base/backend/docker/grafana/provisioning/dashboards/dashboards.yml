# ============================================================
# Grafana Dashboard 自动配置
# ============================================================

apiVersion: 1

providers:
  - name: 'RAG API Dashboards'
    orgId: 1
    folder: 'RAG Knowledge Base'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
