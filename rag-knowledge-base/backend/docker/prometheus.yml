# prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - 'alert_rules.yml'

# 告警通知渠道（可接入 Alertmanager）
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'rag-fastapi'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['rag-api:8000']
        labels:
          service: 'rag-api'
          environment: 'production'

  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis:8001']
        labels:
          service: 'redis'
          environment: 'production'

