<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地 PDF 文档问答 · RAG 基础版</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --danger: #dc2626;
      --ok: #059669;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #e0ecff 0, transparent 40%), var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(980px, 92vw);
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: -0.02em;
    }

    .hint { color: var(--muted); margin: 0; }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 28px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2 span {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: #e8efff;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    form { display: flex; gap: 10px; flex-wrap: wrap; }

    input[type="file"] {
      flex: 1 1 260px;
      padding: 10px;
      border: 1px dashed #c7d2fe;
      border-radius: 10px;
      background: #f8faff;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 92px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }

    textarea:focus, input[type="file"]:focus {
      outline: 2px solid #bfdbfe;
      outline-offset: 1px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    button.danger {
      background: #fee2e2;
      color: var(--danger);
      padding: 6px 12px;
      font-size: 13px;
    }

    button.danger:hover { background: #fecaca; }

    .status { min-height: 22px; margin: 12px 0 0; color: var(--muted); font-size: 14px; }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }

    ul#doc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }

    ul#doc-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfcff;
      font-size: 14px;
    }

    ul#doc-list li span { overflow: hidden; text-overflow: ellipsis; }

    .answer {
      margin-top: 16px;
      padding: 16px;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      background: #f8fbff;
      white-space: pre-wrap;
    }

    .sources { display: grid; gap: 10px; margin-top: 14px; }

    .source {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fcfcfd;
    }

    .source-head { font-size: 13px; font-weight: 700; color: var(--accent); }
    .source-body { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .hidden { display: none; }

    @media (min-width: 760px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .card.wide { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>本地 PDF 文档问答</h1>
      <p class="hint">上传 PDF → 解析、切分、向量化 → 提问获取带来源的答案。全流程可跑在本地 Ollama 上。</p>
    </header>

    <div class="grid">
      <section class="card">
        <h2><span>1</span>上传 PDF</h2>
        <form id="upload-form">
          <input type="file" id="file" accept="application/pdf" required>
          <button type="submit" id="upload-btn">上传并入库</button>
        </form>
        <p id="upload-status" class="status"></p>
      </section>

      <section class="card">
        <h2><span>2</span>已入库文档</h2>
        <ul id="doc-list"></ul>
        <p id="doc-empty" class="hint">暂无文档</p>
      </section>

      <section class="card wide">
        <h2><span>3</span>提问</h2>
        <form id="ask-form">
          <textarea id="question" placeholder="例如：这份文档的核心概念是什么？" required></textarea>
          <button type="submit" id="ask-btn">提问</button>
        </form>
        <p id="ask-status" class="status"></p>
        <div id="answer" class="answer hidden"></div>
        <div id="sources" class="sources"></div>
      </section>
    </div>
  </main>

  <script>
    const api = {
      list: () => fetch("/api/documents").then(handle),
      upload: (file) => {
        const form = new FormData();
        form.append("file", file);
        return fetch("/api/documents", { method: "POST", body: form }).then(handle);
      },
      ask: (question) =>
        fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        }).then(handle),
      remove: (id) => fetch(`/api/documents/${id}`, { method: "DELETE" }).then(handle),
    };

    async function handle(response) {
      if (response.status === 204) return null;
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      return data;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[char]));
    }

    function setStatus(id, text, kind = "") {
      const element = document.getElementById(id);
      element.textContent = text;
      element.className = `status ${kind}`.trim();
    }

    async function refreshDocs() {
      const documents = await api.list();
      const list = document.getElementById("doc-list");
      list.innerHTML = "";
      document.getElementById("doc-empty").style.display = documents.length ? "none" : "block";
      for (const doc of documents) {
        const item = document.createElement("li");
        const label = document.createElement("span");
        label.innerHTML = `<strong>${escapeHtml(doc.filename)}</strong> · ${doc.page_count} 页 · ${doc.chunk_count} 片段`;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "danger";
        button.textContent = "删除";
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            await api.remove(doc.id);
            await refreshDocs();
          } catch (error) {
            setStatus("upload-status", `删除失败：${error.message}`, "error");
          }
        });
        item.append(label, button);
        list.appendChild(item);
      }
    }

    document.getElementById("upload-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("file");
      const button = document.getElementById("upload-btn");
      if (!input.files.length) return;
      button.disabled = true;
      setStatus("upload-status", "上传、解析并向量化中…");
      try {
        const doc = await api.upload(input.files[0]);
        setStatus(
          "upload-status",
          `已入库：${doc.filename}（${doc.page_count} 页 / ${doc.chunk_count} 片段）`,
          "ok",
        );
        input.value = "";
        await refreshDocs();
      } catch (error) {
        setStatus("upload-status", `失败：${error.message}`, "error");
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("ask-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = document.getElementById("question").value.trim();
      const button = document.getElementById("ask-btn");
      const answer = document.getElementById("answer");
      const sources = document.getElementById("sources");
      if (!question) return;
      button.disabled = true;
      setStatus("ask-status", "检索 Top-4 片段并生成中…");
      answer.classList.add("hidden");
      sources.innerHTML = "";
      try {
        const result = await api.ask(question);
        answer.textContent = result.answer;
        answer.classList.remove("hidden");
        for (const source of result.sources) {
          const card = document.createElement("div");
          card.className = "source";
          card.innerHTML = `
            <div class="source-head">#${source.index} ${escapeHtml(source.filename)} p${source.page} · score ${source.score}</div>
            <div class="source-body">${escapeHtml(source.snippet)}</div>
          `;
          sources.appendChild(card);
        }
        setStatus("ask-status", `完成，命中 ${result.sources.length} 个片段`, "ok");
      } catch (error) {
        setStatus("ask-status", `失败：${error.message}`, "error");
      } finally {
        button.disabled = false;
      }
    });

    refreshDocs().catch((error) => {
      document.getElementById("doc-empty").textContent = `加载失败：${error.message}`;
    });
  </script>
</body>
</html>
