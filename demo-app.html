<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>交互演示 · 释文 DocRelease</title>
<meta name="description" content="独立交互演示：切换发布场景、查看输入的代码变更、运行文档生成流水线，并预览与导出自动产出的功能点清单、产品文档与溯源文件。" />
<style>
/* ============================================================
   释文 DocRelease · 交互演示控制台
   单文件、无外部依赖
   ============================================================ */
:root{
  --bg:#eef1f8;
  --panel:#ffffff;
  --panel-2:#fbfcfe;
  --ink:#0f172a;
  --ink-2:#334155;
  --ink-3:#64748b;
  --ink-4:#94a3b8;
  --line:#e3e8ef;
  --line-2:#eef2f7;
  --brand:#2f5bff;
  --brand-2:#1e3fd8;
  --brand-soft:#eef2ff;
  --brand-line:#dde4ff;
  --green:#12996b;
  --green-soft:#eafaf3;
  --amber:#d97706;
  --amber-soft:#fff7e8;
  --rose:#e0555f;
  --rose-soft:#fef2f3;
  --violet:#6d4aff;
  --violet-soft:#f2eeff;
  --teal:#0ea5a0;
  --teal-soft:#e8f8f7;
  --slate-soft:#f1f5f9;
  --term-bg:#0d1424;
  --term-ink:#c9d5e8;
  --term-dim:#7c8aa6;
  --radius:14px;
  --radius-sm:9px;
  --shadow-s:0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  --shadow-m:0 4px 12px rgba(15,23,42,.05), 0 14px 34px rgba(15,23,42,.07);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:radial-gradient(circle at 12% -8%,#e2e9ff 0,transparent 46%),radial-gradient(circle at 92% 4%,#e8f7f4 0,transparent 40%);
  background-repeat:no-repeat;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
code,pre,kbd{font-family:var(--mono)}
::selection{background:var(--brand-soft);color:var(--brand-2)}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar-in{width:min(1560px,calc(100% - 40px));margin:0 auto;height:58px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.015em;font-size:15.5px;white-space:nowrap}
.brand .mk{
  width:26px;height:26px;border-radius:7px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--brand),var(--violet));
  display:grid;place-items:center;box-shadow:0 3px 9px rgba(47,91,255,.32);
}
.brand .mk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand small{font-weight:500;color:var(--ink-4);font-size:12px;letter-spacing:.02em}
.top-tag{
  font-size:11.5px;font-weight:650;color:var(--brand-2);background:var(--brand-soft);
  border:1px solid var(--brand-line);border-radius:999px;padding:2px 9px;
}
.top-sp{flex:1}
.top-link{
  font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;transition:.18s;
}
.top-link:hover{border-color:var(--brand-line);color:var(--brand-2);background:var(--brand-soft)}
.top-link svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 控制条 ---------- */
.console{width:min(1560px,calc(100% - 40px));margin:0 auto;padding:18px 0 40px}
.controls{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 14px;box-shadow:var(--shadow-s);margin-bottom:14px;
}
.ctl-lab{font-size:11.5px;font-weight:700;color:var(--ink-4);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.seg{display:inline-flex;background:var(--slate-soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{
  font-size:12.5px;font-weight:600;color:var(--ink-2);padding:5px 12px;border-radius:7px;
  transition:.16s;white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-2);box-shadow:var(--shadow-s)}
.seg button .v{font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-left:5px}
.seg button[aria-pressed="true"] .v{color:var(--brand)}
.ctl-div{width:1px;height:22px;background:var(--line);margin:0 2px}
.sw{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  cursor:pointer;user-select:none;padding:5px 4px;
}
.sw input{display:none}
.sw .track{width:34px;height:19px;border-radius:999px;background:#d7dee9;position:relative;transition:.2s;flex:0 0 auto}
.sw .track::after{
  content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.25);transition:.2s;
}
.sw input:checked + .track{background:var(--brand)}
.sw input:checked + .track::after{transform:translateX(15px)}
.ctl-sp{flex:1;min-width:8px}
.btn-run{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--brand);color:#fff;font-size:13.5px;font-weight:650;
  padding:9px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(47,91,255,.28);transition:.18s;
}
.btn-run:hover{background:var(--brand-2);transform:translateY(-1px)}
.btn-run:disabled{opacity:.62;cursor:not-allowed;transform:none}
.btn-run svg{width:13px;height:13px;fill:currentColor}
.btn-run.is-run svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.btn-ghost{
  font-size:12.5px;font-weight:600;color:var(--ink-3);padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);background:#fff;transition:.18s;
}
.btn-ghost:hover{color:var(--brand-2);border-color:var(--brand-line);background:var(--brand-soft)}
.hidden{display:none !important}

/* ---------- 三栏工作区 ---------- */
.workspace{
  display:grid;grid-template-columns:305px minmax(0,1fr) minmax(0,1.12fr);
  gap:14px;align-items:stretch;
}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-s);display:flex;flex-direction:column;overflow:hidden;
  min-height:606px;max-height:calc(100vh - 176px);
}
.panel-hd{
  display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);
  background:var(--panel-2);flex:0 0 auto;
}
.panel-hd .no{
  width:19px;height:19px;border-radius:6px;background:var(--brand-soft);color:var(--brand-2);
  display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--mono);flex:0 0 auto;
}
.panel-hd h2{font-size:13.5px;font-weight:700;letter-spacing:-.01em;flex:1;white-space:nowrap}
.panel-hd .meta{font-size:11px;font-family:var(--mono);color:var(--ink-4);white-space:nowrap}
.panel-bd{flex:1;overflow:auto;scrollbar-width:thin}
.panel-bd::-webkit-scrollbar{width:9px;height:9px}
.panel-bd::-webkit-scrollbar-thumb{background:#d6dde8;border-radius:9px;border:2px solid #fff}
.panel-bd::-webkit-scrollbar-thumb:hover{background:#c2cbd9}

/* ---------- 左：代码 diff ---------- */
.repo-head{padding:12px 14px;border-bottom:1px solid var(--line-2);background:#fff}
.repo-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);margin-bottom:3px}
.repo-row:last-child{margin-bottom:0}
.repo-row .k{color:var(--ink-4);min-width:56px;flex:0 0 auto;font-size:11.5px}
.repo-row .v{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);word-break:break-all}
.branch{color:var(--brand-2);font-weight:600}
.brk{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--rose-soft);color:#b23a44;font-family:var(--mono)}

.file{border-bottom:1px solid var(--line-2);transition:.22s}
.file-hd{
  display:flex;align-items:center;gap:7px;padding:8px 14px;background:#fff;
  font-size:11.5px;font-family:var(--mono);color:var(--ink-2);position:relative;
}
.file-hd .st{font-weight:800;flex:0 0 auto;width:9px;text-align:center}
.file-hd .st.a{color:var(--green)}
.file-hd .st.m{color:var(--amber)}
.file-hd .st.d{color:var(--rose)}
.file-hd .fn{flex:1;word-break:break-all}
.file-hd .scan{
  width:13px;height:13px;flex:0 0 auto;opacity:0;transition:.2s;
  color:var(--green);
}
.file.scanned .scan{opacity:1}
.file.scanned .file-hd{background:var(--green-soft)}
.file.cursor .file-hd{background:var(--brand-soft)}
.file.cursor .file-hd::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--brand);
}
.dl{padding:7px 0 9px;background:var(--panel-2);overflow-x:auto}
.dl .ln{
  display:flex;gap:8px;padding:0 14px;font-family:var(--mono);font-size:11.2px;line-height:1.75;
  white-space:pre;color:var(--ink-2);
}
.dl .ln .g{width:8px;flex:0 0 auto;text-align:center;user-select:none}
.dl .ln.add{background:rgba(18,153,107,.075);color:#0b6b4c}
.dl .ln.add .g{color:var(--green)}
.dl .ln.del{background:rgba(224,85,95,.07);color:#a83a43}
.dl .ln.del .g{color:var(--rose)}
.dl .ln.ctx{color:var(--ink-4)}
.dl .ln.ctx .g{color:var(--line)}
.code-note{
  padding:11px 14px;font-size:11.5px;color:var(--ink-3);background:var(--slate-soft);
  border-top:1px solid var(--line-2);line-height:1.65;
}
.code-note b{color:var(--ink-2)}

/* ---------- 中：流水线 ---------- */
.pipe-head{
  display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line-2);
}
.live{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;
  color:var(--ink-3);background:var(--slate-soft);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;font-family:var(--mono);
}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:0 0 auto}
.live.on{color:var(--brand-2);background:var(--brand-soft);border-color:var(--brand-line)}
.live.on i{background:var(--brand);animation:pulse 1s infinite}
.live.ok{color:#0b7a56;background:var(--green-soft);border-color:#c3edda}
.live.ok i{background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pipe-bar{height:2px;background:var(--line-2);overflow:hidden}
.pipe-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--violet));transition:width .4s ease}

.steps{padding:8px;display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.step{
  display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  border:1px solid transparent;transition:.2s;position:relative;
}
.step:hover{background:var(--panel-2)}
.step .sk{
  width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:#f1f4f9;color:var(--ink-4);font-size:11px;font-weight:800;font-family:var(--mono);
  transition:.2s;margin-top:1px;
}
.step .sk svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.step .st{font-size:13px;font-weight:650;color:var(--ink-3);transition:.2s;line-height:1.5}
.step .sd{font-size:11px;font-family:var(--mono);color:var(--ink-4);transition:.2s;word-break:break-all}
.step .exp{
  max-height:0;overflow:hidden;transition:max-height .3s ease;
  font-size:11.5px;color:var(--ink-3);line-height:1.66;
}
.step.open .exp{max-height:260px;margin-top:8px}
.step .exp .row{display:flex;gap:6px;margin-bottom:4px}
.step .exp .row:last-child{margin-bottom:0}
.step .exp .lb{
  flex:0 0 auto;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;height:17px;line-height:15px;
  background:var(--slate-soft);color:var(--ink-3);font-family:var(--mono);
}
.step .exp .lb.r{background:var(--green-soft);color:#0b7a56}
.step .exp .lb.w{background:var(--amber-soft);color:#a2620a}
.step .exp .lb.f{background:var(--rose-soft);color:#b23a44}
.step .chev{
  flex:0 0 auto;width:14px;height:14px;margin-top:4px;color:var(--ink-4);transition:.25s;
  opacity:.55;
}
.step:hover .chev{opacity:1}
.step.open .chev{transform:rotate(180deg)}
.step.active{background:var(--brand-soft);border-color:var(--brand-line)}
.step.active .sk{background:var(--brand);color:#fff}
.step.active .st{color:var(--brand-2)}
.step.active .sd{color:var(--brand)}
.step.done .sk{background:var(--green);color:#fff}
.step.done .st{color:var(--ink)}
.step.done .sd{color:var(--ink-4)}

.term{
  margin:8px;border-radius:var(--radius-sm);background:var(--term-bg);overflow:hidden;
  display:flex;flex-direction:column;flex:1;min-height:170px;
}
.term-hd{
  display:flex;align-items:center;gap:6px;padding:7px 11px;border-bottom:1px solid rgba(255,255,255,.08);
  font-size:11px;font-family:var(--mono);color:var(--term-dim);flex:0 0 auto;
}
.term-hd .dots{display:flex;gap:4px}
.term-hd .dots i{width:8px;height:8px;border-radius:50%;background:#31405c}
.term-hd .dots i:nth-child(1){background:#e0555f}
.term-hd .dots i:nth-child(2){background:#d9a341}
.term-hd .dots i:nth-child(3){background:#3ea87a}
.term-bd{
  padding:9px 11px;overflow:auto;font-family:var(--mono);font-size:11.2px;line-height:1.72;
  flex:1;scrollbar-width:thin;
}
.term-bd::-webkit-scrollbar{width:8px}
.term-bd::-webkit-scrollbar-thumb{background:#2b3a55;border-radius:8px}
.term-bd .lg{display:flex;gap:7px;animation:fadeUp .22s ease both;color:var(--term-ink)}
.term-bd .lg .tg{
  flex:0 0 auto;font-size:10px;font-weight:700;min-width:44px;letter-spacing:.02em;
}
.term-bd .lg .ms{word-break:break-word;white-space:pre-wrap}
.term-bd .lg.g .tg{color:#7dd3a8}
.term-bd .lg.b .tg{color:#8fb0ff}
.term-bd .lg.v .tg{color:#b9a3ff}
.term-bd .lg.t .tg{color:#77d6d2}
.term-bd .lg.a .tg{color:#e8bb6a}
.term-bd .lg.r .tg{color:#f08a92}
.term-bd .lg.s .tg{color:var(--term-dim)}
.term-bd .lg .ms em{color:#e8bb6a;font-style:normal}
.term-bd .lg .ms s{color:#f08a92;text-decoration:none}
.term-bd .lg .ms b{color:#fff;font-weight:600}
.term-empty{color:var(--term-dim);font-size:11.5px;font-family:var(--mono);line-height:1.85}
.term-empty .p{color:#7dd3a8}
@keyframes fadeUp{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ---------- 右：产物 ---------- */
.tabs{display:flex;gap:2px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line-2);flex:0 0 auto}
.tabs button{
  font-size:12.5px;font-weight:600;color:var(--ink-3);padding:6px 11px;border-radius:8px;transition:.16s;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.tabs button:hover{color:var(--ink);background:var(--slate-soft)}
.tabs button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-2)}
.tabs button .f{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.tabs button[aria-pressed="true"] .f{color:var(--brand)}
.tabs .sp{flex:1}
.tabs .btn-ghost{padding:5px 11px;font-size:12px}

.out-body{padding:16px;background:#fff}
.out-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:430px;color:var(--ink-4);gap:12px;padding:30px 24px;
}
.out-empty svg{width:52px;height:52px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.out-empty p{font-size:13.5px;max-width:300px;line-height:1.75}
.out-empty .path{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);background:var(--slate-soft);padding:4px 10px;border-radius:7px}

.doc-hd{
  display:flex;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);
  margin-bottom:16px;flex-wrap:wrap;
}
.doc-hd .vt{font-size:19px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono)}
.doc-hd .sub{font-size:12px;color:var(--ink-4);font-family:var(--mono);margin-top:2px}
.doc-hd .rt{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--slate-soft);
  color:var(--ink-3);border:1px solid var(--line);white-space:nowrap;
}
.chip.auto{background:var(--brand-soft);color:var(--brand-2);border-color:var(--brand-line)}
.chip.mask{background:var(--amber-soft);color:#a2620a;border-color:#f2dcb4}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-bottom:16px}
.stat{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:10px 12px}
.stat .n{font-size:19px;font-weight:800;letter-spacing:-.02em;font-family:var(--mono);line-height:1.3}
.stat .n.g{color:var(--green)}.stat .n.a{color:var(--amber)}.stat .n.r{color:var(--rose)}
.stat .n.v{color:var(--violet)}.stat .n.b{color:var(--brand)}
.stat .l{font-size:11.5px;color:var(--ink-4);margin-top:1px}

.sec-t{
  font-size:14px;font-weight:750;letter-spacing:-.01em;margin:20px 0 10px;display:flex;align-items:center;gap:8px;
  scroll-margin-top:80px;
}
.sec-t:first-child{margin-top:0}
.sec-t .idx{
  font-family:var(--mono);font-size:11px;font-weight:800;color:var(--brand-2);
  background:var(--brand-soft);border-radius:5px;padding:1px 6px;
}
.sec-t .cn{font-size:11.5px;font-weight:600;color:var(--ink-4);font-family:var(--mono)}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  background:var(--panel-2);text-align:left;font-weight:700;color:var(--ink-2);font-size:11.5px;
  padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 11px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:top;line-height:1.65}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td .mono{font-family:var(--mono);font-size:11px;color:var(--ink-3);word-break:break-all}
td .ttl{font-weight:650;color:var(--ink)}
.tag{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;
}
.tag.t-new{background:var(--green-soft);color:#0b7a56}
.tag.t-chg{background:var(--amber-soft);color:#a2620a}
.tag.t-imp{background:var(--violet-soft);color:#5533d6}
.tag.t-fix{background:var(--rose-soft);color:#b23a44}
.tag.t-rem{background:var(--slate-soft);color:var(--ink-3)}
.risk{font-size:11px;font-weight:700;font-family:var(--mono)}
.risk.high{color:#b23a44}.risk.mid{color:#a2620a}.risk.low{color:#0b7a56}

.frow{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:10px;background:#fff}
.frow .fh{display:flex;align-items:flex-start;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.frow .fh .ttl{font-size:14px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:180px}

.frow .kv{display:grid;grid-template-columns:74px 1fr;gap:5px 10px;font-size:12.5px;margin-top:9px}
.frow .kv .k{color:var(--ink-4);font-size:12px}
.frow .kv .v{color:var(--ink-2)}

}
.frow .acc{
  margin-top:10px;padding:9px 11px;background:var(--green-soft);border-radius:var(--radius-sm);
  font-size:12.5px;color:#0b6b4c;line-height:1.72;
}
.frow .acc b{color:#0b7a56}

.tl{border-left:2px solid var(--line);padding-left:18px;margin-left:6px}
.tl .it{position:relative;padding-bottom:16px}
.tl .it:last-child{padding-bottom:0}
.tl .it::before{
  content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;
  background:#fff;border:2.5px solid var(--line);
}
.tl .it.now::before{border-color:var(--brand);background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tl .it.warn::before{border-color:var(--amber);background:var(--amber)}
.tl .d{font-size:11px;font-family:var(--mono);color:var(--ink-4);display:flex;gap:8px;align-items:center;margin-bottom:2px}
.tl .d .who{font-family:var(--font);font-weight:650;color:var(--ink-3);font-size:11.5px}
.tl .x{font-size:12.5px;color:var(--ink-2);line-height:1.72}
.tl .it.now .x{color:var(--ink);font-weight:600}
.tl .dv{
  display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;
  background:var(--rose-soft);color:#b23a44;margin-left:6px;
}

.json{
  background:var(--term-bg);border-radius:var(--radius-sm);padding:15px 16px;overflow-x:auto;
  font-family:var(--mono);font-size:11.8px;line-height:1.78;color:var(--term-ink);white-space:pre;
}
.json .jk{color:#8fb0ff}
.json .js{color:#7dd3a8}
.json .jn{color:#e8bb6a}

        '<div class="sub">溯源文件 · 供审计与复盘使用</div></div>' +
        '<div class="rt"><span class="chip auto">自动生成</span>' +
        (S.mask ? '<span class="chip mask">已脱敏</span>' : "") + "</div></div>" +
      '<div class="json">' + hlJSON(traceObj()) + "</div>" +
      '<div class="note-box blue"><b>为什么要有这个文件</b>：当有人问「这条功能是哪个版本上的、依据哪次构建、' +
      "当时的文档写了什么」，不必翻聊天记录。这条链路可审计、可复盘，也是「上线与文档一致」的技术证据。</div>";
  }

  function renderOut() {
    if (!S.done) { outEmpty(); return; }
    var s = scene();
    $("outMeta").textContent = "3 个文件 · docs/release/" + s.version + "/";
    $("expBtn").classList.remove("hidden");
    if (S.tab === "checklist") $("outBody").innerHTML = checklistHTML();
    else if (S.tab === "doc") $("outBody").innerHTML = docHTML();
    else $("outBody").innerHTML = traceHTML();
  }

  /* ============================================================
     6. 导出
     ============================================================ */

  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1200);
  }

  function toCSV() {
    var s = scene();
    var q = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
    var lines = ["序号,分类,功能点,业务说明,影响范围,风险,代码路径,验收要点,运营动作,负责角色,破坏性变更"];
    s.features.forEach(function (f, i) {
      lines.push([i + 1, f.tag, f.title, toneText(f), f.scope, f.risk,
        f.paths.map(maskPath).join(" "), f.acceptance, f.action, f.role,
        f.breaking ? "是" : "否"].map(q).join(","));
    });
    return "\ufeff" + lines.join("\r\n");
  }

  function toMD() {
    var s = scene();
    var L = [];
    L.push("# " + s.version + " 业务化产品文档", "");
    L.push("> 由释文 DocRelease 于 CI 构建成功后自动生成，未经人工撰写。" + (S.mask ? "（已脱敏）" : ""), "");
    L.push("## 一、文档信息", "");
    L.push("| 项 | 值 |", "| --- | --- |");
    L.push("| 版本号 | " + s.version + " |");
    L.push("| 代码基线 | " + s.branch + " @ " + maskCommit(s.tip) + " |");
    L.push("| 触发方式 | ci.build.success " + (S.mask ? "***" : s.ciRun) + " |");
    L.push("| 解析范围 | " + s.stats.files + " files · " + s.stats.modules + " modules |");
    L.push("| 术语风格 | " + (S.tone === "tech" ? "偏技术" : "偏业务") + " |");
    L.push("| 脱敏状态 | " + (S.mask ? "已脱敏" : "未脱敏") + " |", "");
    L.push("## 二、本次发布概览", "");
    L.push("本次发布累计 " + s.stats.commits + " 个提交，涉及 " + s.stats.files + " 个文件、" +
      s.features.length + " 项业务能力变化，开发跨度约 " + s.days + "。", "");
    L.push("## 三、业务能力变更明细", "");
    s.features.forEach(function (f, i) {
      L.push("### " + (i + 1) + ". [" + f.tag + "] " + f.title, "");
      L.push(toneText(f), "");
      L.push("- **用户可见变化**：" + f.visible);
      L.push("- **影响范围**：" + f.scope);
      L.push("- **代码路径**：" + f.paths.map(maskPath).join("、"));
      L.push("- **风险等级**：" + f.risk + (f.breaking ? "（破坏性变更）" : ""), "");
    });
    L.push("## 四、影响范围与兼容性", "");
    L.push("## 五、运营侧需同步的动作", "");
    L.push("| 待办动作 | 负责角色 |", "| --- | --- |");
    s.features.forEach(function (f) { L.push("| " + f.action + " | " + f.role + " |"); });
    L.push("", "## 六、验收要点", "");
    L.push("| # | 功能点 | 验收方式与判定标准 |", "| --- | --- | --- |");
    s.features.forEach(function (f, i) { L.push("| " + (i + 1) + " | " + f.title + " | " + f.acceptance + " |"); });
    L.push("", "## 七、变更留痕与决策溯源", "");
    s.history.forEach(function (it) { L.push("- **" + it.d + " · " + it.who + "**（" + (it.cls === "warn" ? "与最终实现不一致" : "已确认") + "）：" + it.text); });
    L.push("", "## 八、附录 · 生成说明与能力边界", "");
    L.push("本文件只记录「已进入代码的变更」。口头约定、临时放宽的执行尺度、未落地的决策方案不会出现在变更描述中。", "");
    return L.join("\n");
  }

  function doExport() {
    var s = scene();
    if (S.tab === "checklist") download("功能点清单_" + s.version + ".csv", toCSV(), "text/csv;charset=utf-8");
    else if (S.tab === "doc") download("业务化产品文档_" + s.version + ".md", toMD(), "text/markdown;charset=utf-8");
    else download("trace_" + s.version + ".json", JSON.stringify(traceObj(), null, 2), "application/json;charset=utf-8");
  }

  /* ============================================================
     7. 运行流水线
     ============================================================ */

  var timers = [];
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  var STEP_MS = 760, LINE_MS = 155;

  function setLive(cls, txt) {
    $("live").className = "live " + cls;
    $("liveTxt").textContent = txt;
  }

  function resetAll(keepDone) {
    clearTimers();
    S.running = false;
    if (!keepDone) { S.done = false; }
    resetScan();
    clearStepStates();
    $("pipeBar").style.width = "0%";
    $("runBtn").disabled = false;
    $("runBtn").classList.remove("is-run");
    $("runBtn").querySelector("svg").innerHTML = '<path d="M8 5.5v13l11-6.5-11-6.5z"/>';
    $("runLabel").textContent = "运行发布";
    $("skipBtn").classList.add("hidden");
    setLive("", "待触发 · " + scene().branch);
    termReset();
    renderOut();
  }

  function finish() {
    S.running = false;
    S.done = true;
    var s = scene();
    var brk = s.features.filter(function (f) { return f.breaking; }).length;
    setLive(brk ? "ok" : "ok", (brk ? "已完成（含破坏性变更）· " : "已完成 · ") + s.version);
    $("pipeBar").style.width = "100%";
    $("runBtn").disabled = false;
    $("runBtn").querySelector("svg").innerHTML =
      '<path d="M4 5h16v2H4zM4 11h16v2H4zM4 17h16v2H4z"/>';
    $("runLabel").textContent = "重新演示";
    $("skipBtn").classList.add("hidden");
    renderOut();
  }

  function run(instant) {
    if (S.running) return;
    S.done = false;
    resetAll(true);
    S.running = true;
    renderOut();
    var s = scene();
    var logs = LOGS[s.id];
    var byStep = [];
    for (var i = 0; i < STEPS.length; i++) byStep.push(logs.filter(function (l) { return l[0] === i; }));

    $("term").innerHTML = "";
    $("runBtn").disabled = true;
    $("runBtn").classList.add("is-run");
    $("runBtn").querySelector("svg").innerHTML =
      '<path d="M12 3a9 9 0 1 0 9 9"/><path d="M21 3v6h-6"/>';
    $("runLabel").textContent = instant ? "生成中…" : "运行中…";
    if (!instant) $("skipBtn").classList.remove("hidden");
    setLive("on", "运行中 · 0 / " + STEPS.length);
    logLine("g", "exec", "docrelease run --from=ci.build.success --repo=order-center");

    if (instant) {
      var steps = $("steps").querySelectorAll(".step");
      var fss = $("inBody").querySelectorAll(".file");
      for (var a = 0; a < steps.length; a++) steps[a].classList.add("done");
      for (var b = 0; b < fss.length; b++) fss[b].classList.add("scanned");
      $("pipeBar").style.width = "100%";
      byStep.forEach(function (ls) { ls.forEach(function (l) { logLine(l[1], l[2], l[3]); }); });
      finish();
      return;
    }

    STEPS.forEach(function (st, si) {
      var t0 = si * STEP_MS;
      timers.push(setTimeout(function () {
        var all = $("steps").querySelectorAll(".step");
        for (var k = 0; k < all.length; k++) all[k].classList.remove("active");
        all[si].classList.add("active");
        setLive("on", "运行中 · " + (si + 1) + " / " + STEPS.length);
        $("pipeBar").style.width = ((si + 0.5) / STEPS.length * 100) + "%";
      }, t0));

      /* 第 3 步：逐文件「被解析」高亮 */
      if (si === 2) {
        var fs = $("inBody").querySelectorAll(".file");
        for (var fi = 0; fi < fs.length; fi++) {
          (function (el, idx) {
            timers.push(setTimeout(function () {
              var list = $("inBody").querySelectorAll(".file");
              for (var k = 0; k < list.length; k++) list[k].classList.remove("cursor");
              el.classList.add("scanned", "cursor");
            }, t0 + 60 + idx * 150));
          })(fs[fi], fi);
        }
      }

      var lines = byStep[si];
      var span = STEP_MS * 0.72;
      lines.forEach(function (l, li) {
        timers.push(setTimeout(function () {
          logLine(l[1], l[2], l[3]);
        }, t0 + 40 + li * Math.max(70, span / Math.max(1, lines.length))));
      });

      timers.push(setTimeout(function () {
        var all = $("steps").querySelectorAll(".step");
        all[si].classList.remove("active");
        all[si].classList.add("done");
        $("pipeBar").style.width = ((si + 1) / STEPS.length * 100) + "%";
      }, t0 + span + 60));
    });

    timers.push(setTimeout(function () {
      var list = $("inBody").querySelectorAll(".file");
      for (var k = 0; k < list.length; k++) list[k].classList.remove("cursor");
      if (S.mask) logLine("a", "mask", "已按脱敏策略处理：仓库路径 " + s.stats.files + " 处 · 提交指纹 " + s.stats.files + " 处");
      finish();
    }, STEPS.length * STEP_MS + 220));
  }

  /* ============================================================
     8. 初始化与事件
     ============================================================ */

  function segScene() {
    $("sceneSeg").innerHTML = SCENARIOS.map(function (s) {
      return '<button data-scene="' + s.id + '" aria-pressed="' + (s.id === S.scene) + '">' +
        esc(s.name) + '<span class="v">' + esc(s.version) + '</span></button>';
    }).join("");
  }

  function renderAll() {
    resetAll(false);
    renderInput();
    renderSteps();
  }

  /* 场景切换 */
  $("sceneSeg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-scene]");
    if (!b || S.running) return;
    S.scene = b.getAttribute("data-scene");
    var bs = $("sceneSeg").querySelectorAll("button");
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", String(bs[i] === b));
    S.openStep = -1;
    renderAll();
  });

  /* 术语风格 */
  $("toneSeg").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tone]");
    if (!b) return;
    S.tone = b.getAttribute("data-tone");
    var bs = $("toneSeg").querySelectorAll("button");
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", String(bs[i] === b));
    if (S.done) renderOut();   /* 参数改变即时反映到产物 */
  });

  /* 脱敏开关 */
  $("maskSw").addEventListener("change", function () {
    S.mask = this.checked;
    renderInput();
    if (S.done) {
      renderOut();
      logLine("a", "mask", S.mask ? "输出已切换为脱敏模式，重新渲染产物" : "输出已切换为未脱敏模式，重新渲染产物");
    }
  });

  /* 产物 Tab */
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (!b) return;
    S.tab = b.getAttribute("data-tab");
    var bs = $("tabs").querySelectorAll("[data-tab]");
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute("aria-pressed", String(bs[i] === b));
    renderOut();
  });

  /* 步骤展开 */
  $("steps").addEventListener("click", function (e) {
    var st = e.target.closest(".step");
    if (!st) return;
    var i = parseInt(st.getAttribute("data-step"), 10);
    var els = $("steps").querySelectorAll(".step");
    if (S.openStep === i) { st.classList.remove("open"); S.openStep = -1; return; }
    for (var k = 0; k < els.length; k++) els[k].classList.remove("open");
    st.classList.add("open");
    S.openStep = i;
  });

  $("runBtn").addEventListener("click", function () { run(false); });
  $("skipBtn").addEventListener("click", function () {
    clearTimers();
    var steps = $("steps").querySelectorAll(".step");
    for (var i = 0; i < steps.length; i++) { steps[i].classList.remove("active"); steps[i].classList.add("done"); }
    var fs = $("inBody").querySelectorAll(".file");
    for (var k = 0; k < fs.length; k++) fs[k].classList.add("scanned");
    var s = scene();
    LOGS[s.id].forEach(function (l) { logLine(l[1], l[2], l[3]); });
    finish();
  });
  $("expBtn").addEventListener("click", doExport);

  /* 启动 */
  segScene();
  renderAll();
  /* 首次进入给出一次轻微提示，不自动播放 */
  (function hint() {
    var btn = $("runBtn"), n = 0;
    var iv = setInterval(function () {
      n++;
      btn.style.boxShadow = n % 2 ? "0 4px 14px rgba(47,91,255,.28)" : "0 4px 14px rgba(47,91,255,.28), 0 0 0 7px rgba(47,91,255,.14)";
      if (n >= 6) { clearInterval(iv); btn.style.boxShadow = ""; }
    }, 420);
  })();
})();
</script>
</body>
</html>
